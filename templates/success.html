{% extends "layout.html" %} {% block title %}ผลงาน{% endblock %} {% block
content %}
<section
  class="black-image"
  class="black-image:hover"
  style="
    background: url(../static/images/page2-5.jpg)
      no-repeat center/cover;
    height: 425px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    opacity: 1;
  "
>
  <div>
    <h2
      style="
        font-size: 4rem;
        color: #ffffff;
        text-shadow: 10px 10px 40px rgb(0, 0, 0);
      "
    >
      การปฏิบัติที่ประจักษ์
    </h2>
    <p
      style="
        font-size: 2rem;
        margin-top: -18px;
        color: #ffd300;
        text-shadow: 10px 10px 40px #000000;
        font-weight: bold;
        text-decoration: underline;
      "
    >
      ACHIEVEMENT
    </p>
  </div>
</section>
<main>
  <div class="container">
    <h1>สรุปข่าวและผลการปฏิบัติงาน</h1>

    <div id="loading" class="loading">กำลังโหลดข้อมูล...</div>

    <div class="filter-container" id="filterContainer" style="display: none">
      <label for="monthSelect" class="filter-label">เลือกช่วงเวลา :</label>
      <select id="monthSelect" class="custom-select">
        <option value="all">ทั้งหมด</option>
      </select>
    </div>

    <div id="currentMonthTitle" class="month-title" style="display: none"></div>

    <div id="newsGrid" class="cards-grid fade-in"></div>
  </div>
</main>

<script>
  const SHEET_ID = "1s9Px5lhvXmfGuogF8E-QFZiPq_hJk74Rn5gULDxTMl8";
  const GID = "0";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

  // --- การตั้งค่าคอลัมน์ (Index เริ่มที่ 0) ---
  const COL_MONTH = 0; // Col A: ตัวกรองเดือน
  const COL_TITLE = 2; // Col C: ชื่อเรื่อง
  const COL_DATE = 6; // Col G: วันที่
  const COL_LINK = 7; // Col H: ลิ้งค์ข่าว
  const COL_IMG = 8; // Col I: รูปภาพ

  let allNewsData = [];

  async function fetchData() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      const rows = csvToArray(data).slice(1); // ตัด Header

      allNewsData = rows
        .map((row) => {
          if (row.length < 2) return null;
          return {
            filterMonth: row[COL_MONTH] ? row[COL_MONTH].trim() : "อื่นๆ",
            title: row[COL_TITLE],
            displayDate: row[COL_DATE],
            link: row[COL_LINK],
            image: processImageUrl(row[COL_IMG]), // แปลงลิ้งค์รูปภาพ
          };
        })
        .filter((item) => item && item.title);

      initDropdown();
      document.getElementById("loading").style.display = "none";
      document.getElementById("filterContainer").style.display = "flex";
    } catch (error) {
      console.error("Error:", error);
      document.getElementById("loading").innerText = "ไม่สามารถดึงข้อมูลได้";
    }
  }

  function initDropdown() {
    const select = document.getElementById("monthSelect");

    // ดึงรายชื่อเดือนทั้งหมดที่มี (Unique)
    const uniqueMonths = [
      ...new Set(allNewsData.map((item) => item.filterMonth)),
    ];

    // เพิ่มตัวเลือกเข้าไปใน Dropdown
    uniqueMonths.forEach((month) => {
      if (month !== "อื่นๆ" && month !== "") {
        const option = document.createElement("option");
        option.value = month;
        option.innerText = month;
        select.appendChild(option);
      }
    });

    // เพิ่ม Event Listener เมื่อเลือกค่าใหม่
    select.addEventListener("change", function () {
      filterNews(this.value);
    });

    // โหลดข้อมูลทั้งหมดเป็นค่าเริ่มต้น
    filterNews("all");
  }

  function filterNews(monthKey) {
    let filteredData;
    const titleElem = document.getElementById("currentMonthTitle");

    if (monthKey === "all") {
      filteredData = allNewsData;
      titleElem.innerText = "ข่าวทั้งหมด";
    } else {
      filteredData = allNewsData.filter(
        (item) => item.filterMonth === monthKey,
      );
      titleElem.innerText = `ประจำเดือน ${monthKey}`;
    }

    titleElem.style.display = "block";
    renderCards(filteredData);
  }

  function renderCards(data) {
    const grid = document.getElementById("newsGrid");
    grid.innerHTML = "";

    // Animation Reset
    grid.classList.remove("fade-in");
    void grid.offsetWidth;
    grid.classList.add("fade-in");

    if (data.length === 0) {
      grid.innerHTML =
        '<p style="text-align:center; width:100%; color:#888;">ไม่พบข้อมูลข่าวในช่วงเวลานี้</p>';
      return;
    }

    data.forEach((item) => {
      const imgUrl =
        item.image && item.image.trim() !== ""
          ? item.image
          : "https://via.placeholder.com/400x300?text=No+Image";
      const linkUrl = item.link && item.link.trim() !== "" ? item.link : "#";
      const targetAttr = linkUrl !== "#" ? 'target="_blank"' : "";
      const dateTxt = item.displayDate || "";

      const cardHtml = `
                    <a href="${linkUrl}" class="news-card" ${targetAttr}>
                        <div class="card-image ">
                            <img src="${imgUrl}" alt="${item.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400?text=No+Image'">
                        </div>
                        <div class="card-content">
                            <span class="card-date">${dateTxt}</span>
                            <h3 class="card-title">${item.title}</h3>
                        </div>
                    </a>
                `;
      grid.innerHTML += cardHtml;
    });
  }

function processImageUrl(url) {
  // 1. ถ้าไม่มี URL ให้คืนค่ารูป Default
  if (!url || url.trim() === "") {
    return "https://media.istockphoto.com/id/1443200221/th/%E0%B9%80%E0%B8%A7%E0%B8%84%E0%B9%80%E0%B8%95%E0%B8%AD%E0%B8%A3%E0%B9%8C/%E0%B9%84%E0%B8%AD%E0%B8%84%E0%B8%AD%E0%B8%99%E0%B9%82%E0%B8%9F%E0%B8%A5%E0%B9%80%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B9%81%E0%B8%9F%E0%B9%89%E0%B8%A1%E0%B9%83%E0%B8%99%E0%B8%AA%E0%B9%84%E0%B8%95%E0%B8%A5%E0%B9%8C%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%95%E0%B8%B9%E0%B8%99-%E0%B9%80%E0%B8%AD%E0%B8%81%E0%B8%AA%E0%B8%B2%E0%B8%A3%E0%B9%80%E0%B8%81%E0%B9%87%E0%B8%9A%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%81%E0%B8%AD%E0%B8%9A%E0%B9%80%E0%B8%A7%E0%B8%81%E0%B9%80%E0%B8%95%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%95%E0%B8%B9%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%9E%E0%B8%B7%E0%B9%89%E0%B8%99%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87%E0%B9%81%E0%B8%A2%E0%B8%81-%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%88%E0%B8%B1%E0%B8%94.jpg?s=170667a&w=0&k=20&c=M2-rjizWhd1_DlwVtRG3nAEc0fVWo8CQgSseSWFTSAo=";
  }

  url = url.trim();

  // 2. ตรวจสอบว่าเป็น Google Drive หรือไม่
  if (url.includes("drive.google.com")) {
    let fileId = "";

    // ใช้ Regex ค้นหา ID ของไฟล์ (จะรองรับทั้ง /d/ID/view และ id=ID)
    const regExp = /\/d\/([^\/]+)|id=([^&]+)/;
    const match = url.match(regExp);

    if (match) {
      // ถ้าเจอในรูปแบบ /d/ID/ ค่าจะอยู่ใน match[1] ถ้าเจอแบบ id=ID ค่าจะอยู่ใน match[2]
      fileId = match[1] || match[2];
    }

    if (fileId) {
      // ✅ เปลี่ยนมาใช้ Google Drive Thumbnail API เพื่อให้รูปภาพแสดงผลได้
      // sz=w800 คือการกำหนดความกว้างของรูป หากต้องการให้ชัดขึ้นสามารถปรับเป็น w1000 ได้
      return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
    }
  }

  // 3. ถ้าไม่ใช่ Drive หรือหา ID ไม่เจอ ให้คืนค่าเดิม
  return url;
}

  // CSV Parser
  function csvToArray(text) {
    let p = "",
      row = [" "],
      ret = [row],
      i = 0,
      r = 0,
      s = !0,
      l;
    for (l of text) {
      if ('"' === l) {
        if (s && l === p) row[i] += l;
        s = !s;
      } else if ("," === l && s) l = row[++i] = "";
      else if ("\n" === l && s) {
        if (p === "\r") row[i] = row[i].slice(0, -1);
        row = ret[++r] = [(l = "")];
        i = 0;
      } else row[i] += l;
      p = l;
    }
    return ret;
  }

  // เริ่มต้น
  fetchData();
</script>
{% endblock %}

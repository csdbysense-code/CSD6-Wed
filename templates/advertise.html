{% extends "layout.html" %} {% block title %}ประชาสัมพันธ์{% endblock %} {%
block content %}
<section
  class="black-image"
  class="black-image:hover"
  style="
    background: url(&quot;https://scontent.fbkk5-6.fna.fbcdn.net/v/t39.30808-6/557499637_843430604857145_2851904496190113233_n.jpg?_nc_cat=102&ccb=1-7&_nc_sid=86c6b0&_nc_ohc=qcE8G93QocYQ7kNvwECIRil&_nc_oc=Adn6J2ENd1QK-Hc7LUw_Hfx33IIT5JpzHTUHikYriDDGI7uaBgjIcv7n9fxbHmrV57k&_nc_zt=23&_nc_ht=scontent.fbkk5-6.fna&_nc_gid=A5CCI9yrP2GvRnxBERvasg&oh=00_AfuheQ9RL7K0OzgTgmpcEJMzXC9GmA5JZx3K2Atzy_FU6g&oe=6988C5BF&quot;)
      no-repeat center/cover;
    height: 425px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    opacity: 1;
  "
>
  <div>
    <h2
      style="
        font-size: 4rem;
        color: #ffffff;
        text-shadow: 10px 10px 40px rgb(0, 0, 0);
      "
    >
      ประชาสัมพันธ์
    </h2>
    <p
      style="
        font-size: 2rem;
        margin-top: -30px;
        color: #ffd300;
        text-shadow: 10px 10px 40px #000000;
        font-weight: bold;
        text-decoration: underline;
      "
    >
      ADVERTISE
    </p>
  </div>
</section>
<main>
  <div class="container">
    <div class="header-section">
      <h1 id="pageTitle" class="header-title">กำลังโหลด...</h1>
      <select id="categoryFilter" class="filter-select">
        <option value="all">ทั้งหมด</option>
      </select>
    </div>

    <div id="loading" class="loading">กำลังดึงข้อมูลจาก Google Sheets...</div>
    <div id="newsGrid" class="news-grid"></div>
  </div>
</main>

<script>
  // --- การตั้งค่า (CONFIG) ---
  const SHEET_ID = "1MssMgNiDmuRcGQNYi0pUylPMoUPjxMTu9f9Sslfe0mM";
  const GID = "0";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

  // --- ตั้งค่าคอลัมน์ (Index เริ่มที่ 0) ---
  // A=0, B=1, C=2, D=3, E=4
  const COL_CATEGORY = 0; // Col A: ประเภทงาน
  const COL_DATE = 1; // Col B: วันที่
  const COL_TITLE = 2; // Col C: หัวข้อเรื่อง
  const COL_LINK = 3; // Col D: Link URL
  const COL_IMG = 4; // Col E: Image URL

  let allData = [];

  // ฟังก์ชันหลักเริ่มทำงาน
  async function init() {
    try {
      const response = await fetch(CSV_URL);
      const text = await response.text();

      // แปลง CSV เป็น Array
      const rows = parseCSV(text);

      // ข้าม Header (row 0) และ map ข้อมูล
      allData = rows
        .slice(1)
        .map((row) => {
          // กรองแถวว่าง (ต้องมีหัวข้อเรื่อง)
          if (!row[COL_TITLE]) return null;

          return {
            category: row[COL_CATEGORY] ? row[COL_CATEGORY].trim() : "ทั่วไป",
            date: row[COL_DATE] || "",
            title: row[COL_TITLE],
            link: row[COL_LINK] ? row[COL_LINK].trim() : "#",
            image: processImageUrl(row[COL_IMG]), // แปลงลิ้งค์รูปภาพ
          };
        })
        .filter((item) => item !== null);

      setupDropdown();
      renderCards(allData);

      document.getElementById("loading").style.display = "none";
      document.getElementById("pageTitle").innerText = "ประชาสัมพันธ์ข่าวสาร";
    } catch (error) {
      console.error(error);
      document.getElementById("loading").innerText =
        "เกิดข้อผิดพลาดในการดึงข้อมูล";
    }
  }

  // ฟังก์ชันสร้าง Dropdown Filter
  function setupDropdown() {
    const select = document.getElementById("categoryFilter");
    const categories = [...new Set(allData.map((d) => d.category))];

    categories.forEach((cat) => {
      if (cat) {
        const option = document.createElement("option");
        option.value = cat;
        option.innerText = cat;
        select.appendChild(option);
      }
    });

    select.addEventListener("change", (e) => {
      const filter = e.target.value;
      const titleElem = document.getElementById("pageTitle");

      if (filter === "all") {
        renderCards(allData);
        titleElem.innerText = "ประชาสัมพันธ์ข่าวสาร";
      } else {
        const filtered = allData.filter((item) => item.category === filter);
        renderCards(filtered);
        titleElem.innerText = `หมวดหมู่: ${filter}`;
      }
    });
  }

  // ฟังก์ชันแสดงผลการ์ด
  function renderCards(data) {
    const grid = document.getElementById("newsGrid");
    grid.innerHTML = "";

    // Animation Reset
    grid.classList.remove("fade-in");
    void grid.offsetWidth;
    grid.classList.add("fade-in");

    if (data.length === 0) {
      grid.innerHTML =
        '<p style="text-align:center; width:100%; color:#888;">ไม่พบข้อมูล</p>';
      return;
    }

    data.forEach((item) => {
      const targetAttr = item.link !== "#" ? 'target="_blank"' : "";

      const card = `
                    <a href="${item.link}" class="news-card" ${targetAttr}>
                        <div class="card-image">
                            <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400?text=No+Image'">
                        </div>
                        <div class="card-content">
                            <div class="card-tag">${item.category}</div>
                            <div class="card-date">
                                 ${item.date}
                            </div>
                            <h3 class="card-title">${item.title}</h3>
                        </div>
                    </a>
                `;
      grid.innerHTML += card;
    });
  }

  // ฟังก์ชันจัดการ URL รูปภาพ (รองรับ Google Drive)
  function processImageUrl(url) {
    if (!url || url.trim() === "")
      return "https://media.istockphoto.com/id/1443200221/th/%E0%B9%80%E0%B8%A7%E0%B8%84%E0%B9%80%E0%B8%95%E0%B8%AD%E0%B8%A3%E0%B9%8C/%E0%B9%84%E0%B8%AD%E0%B8%84%E0%B8%AD%E0%B8%99%E0%B9%82%E0%B8%9F%E0%B8%A5%E0%B9%80%E0%B8%94%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B9%81%E0%B8%9F%E0%B9%89%E0%B8%A1%E0%B9%83%E0%B8%99%E0%B8%AA%E0%B9%84%E0%B8%95%E0%B8%A5%E0%B9%8C%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%95%E0%B8%B9%E0%B8%99-%E0%B9%80%E0%B8%AD%E0%B8%81%E0%B8%AA%E0%B8%B2%E0%B8%A3%E0%B9%80%E0%B8%81%E0%B9%87%E0%B8%9A%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%81%E0%B8%AD%E0%B8%9A%E0%B9%80%E0%B8%A7%E0%B8%81%E0%B9%80%E0%B8%95%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%95%E0%B8%B9%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%9E%E0%B8%B7%E0%B9%89%E0%B8%99%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87%E0%B9%81%E0%B8%A2%E0%B8%81-%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%88%E0%B8%B1%E0%B8%94.jpg?s=170667a&w=0&k=20&c=M2-rjizWhd1_DlwVtRG3nAEc0fVWo8CQgSseSWFTSAo=";

    // ตัดช่องว่างหน้า-หลัง URL ออกก่อน
    url = url.trim();

    if (url.includes("drive.google.com")) {
      let fileId = "";

      // แบบที่ 1: มาเป็นแบบ /d/FILE_ID/view
      if (url.includes("/d/")) {
        fileId = url.split("/d/")[1].split("/")[0];
      }
      // แบบที่ 2: มาเป็นแบบ id=FILE_ID
      else if (url.includes("id=")) {
        fileId = url.split("id=")[1].split("&")[0];
      }

      if (fileId) {
        // ใช้ลิ้งก์ข้ามขั้นตอน Preview เพื่อดึงไฟล์ภาพโดยตรง
        return `https://drive.google.com/uc?export=view&id=${fileId}`;
      }
    }

    // ถ้าไม่ใช่ Google Drive หรือหา ID ไม่เจอ ให้คืนค่า URL เดิม (เผื่อเป็นลิ้งก์เว็บอื่น)
    return url;
  }

  // ฟังก์ชันแปลง CSV (รองรับเครื่องหมายจุลภาคในข้อความ)
  function parseCSV(text) {
    let arr = [];
    let quote = false; // สถานะว่าอยู่ใน "..." หรือไม่
    let row = [];
    let col = "";

    for (let c = 0; c < text.length; c++) {
      let cc = text[c],
        nc = text[c + 1];

      if (cc === '"') {
        if (quote && nc === '"') {
          col += '"';
          ++c;
        } // "" -> "
        else {
          quote = !quote;
        }
      } else if (cc === "," && !quote) {
        row.push(col);
        col = "";
      } else if (cc === "\r" && nc === "\n" && !quote) {
        row.push(col);
        col = "";
        arr.push(row);
        row = [];
        ++c;
      } else if (cc === "\n" && !quote) {
        row.push(col);
        col = "";
        arr.push(row);
        row = [];
      } else if (cc === "\r" && !quote) {
        row.push(col);
        col = "";
        arr.push(row);
        row = [];
      } else {
        col += cc;
      }
    }
    if (col !== "") row.push(col);
    if (row.length > 0) arr.push(row);
    return arr;
  }

  // Run
  init();
</script>
{% endblock %}
